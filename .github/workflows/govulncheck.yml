name: govulncheck

# Pull requests and main are scanned by the govulncheck job of ci.yml.
on:
  schedule:
    # Weekly catch for newly-disclosed stdlib/toolchain CVEs. A red run emails you.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Scan for reachable vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest patch of go.mod's version (same as CI), so stdlib CVEs
          # already patched upstream don't show as reachable.
          go-version-file: go.mod
          check-latest: true
          cache: true
      # golang.org/x/vuln is maintained by the Go team and verified via the Go
      # checksum DB; the vulnerability database is fetched fresh on every run.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
