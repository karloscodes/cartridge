<h1>New note</h1>
<form method="post" action="/notes">
  <label for="body">Note</label>
  <textarea id="body" name="body" rows="6"{{with .Problems.Body}} aria-invalid="true" aria-describedby="body-problem"{{end}}>{{.Note.Body}}</textarea>
  {{with .Problems.Body}}<p id="body-problem" class="problem">{{.}}</p>{{end}}
  <button>Save</button>
  <a href="/notes">Cancel</a>
</form>
