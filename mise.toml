# Tools for work on cartridge. `mise install` gets them.
[tools]
sqlc = "1.31.1"

[tasks.generate]
description = "Write the Go code of the example app's SQL queries again"
dir = "examples/notes"
run = "sqlc generate"

[tasks.test]
description = "Vet and test everything"
run = "go vet ./... && go test ./..."
