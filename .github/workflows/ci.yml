name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # go.mod says go 1.26.0. setup-go treats that as the exact release,
          # so check-latest would not leave 1.26.0 and govulncheck would scan
          # an unpatched stdlib. Ask for the minor; check-latest takes the
          # newest 1.26.x.
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build without cgo
        # Apps build standalone binaries with CGO_ENABLED=0 (GoReleaser).
        run: CGO_ENABLED=0 go build ./... && CGO_ENABLED=0 go vet ./...

      - name: Run tests
        run: go test -v -race ./...

  # The database tests skip themselves without their DSN, so each database
  # has its own job. The jobs run at the same time as the main tests.
  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cartridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # go.mod says go 1.26.0. setup-go treats that as the exact release,
          # so check-latest would not leave 1.26.0 and govulncheck would scan
          # an unpatched stdlib. Ask for the minor; check-latest takes the
          # newest 1.26.x.
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Run PostgreSQL tests
        run: go test -v -race ./postgres
        env:
          CARTRIDGE_POSTGRES_DSN: postgres://postgres:test@localhost:5432/cartridge_test

  mysql:
    name: MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: cartridge_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # go.mod says go 1.26.0. setup-go treats that as the exact release,
          # so check-latest would not leave 1.26.0 and govulncheck would scan
          # an unpatched stdlib. Ask for the minor; check-latest takes the
          # newest 1.26.x.
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Run MySQL tests
        run: go test -v -race ./mysql
        env:
          CARTRIDGE_MYSQL_DSN: root:test@tcp(localhost:3306)/cartridge_test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # go.mod says go 1.26.0. setup-go treats that as the exact release,
          # so check-latest would not leave 1.26.0 and govulncheck would scan
          # an unpatched stdlib. Ask for the minor; check-latest takes the
          # newest 1.26.x.
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          install-mode: goinstall

  # Minor, not go.mod's 1.26.0: an exact patch pins setup-go, and go.mod names only
  # the oldest Go this library supports.
  security:
    uses: karloscodes/workflows/.github/workflows/go-security.yml@v1.1.0
    with:
      go-version: "1.26"

  gitleaks:
    uses: karloscodes/workflows/.github/workflows/gitleaks.yml@v1.1.0

  # The one check to require on main: it passes when every job above passed.
  test:
    name: test
    if: always()
    needs: [go-test, postgres, mysql, lint, security, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"
